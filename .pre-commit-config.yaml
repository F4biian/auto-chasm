# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: check-file-length
        name: check-file-length
        entry: uv run python scripts/check_file_length.py src tests
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: check-docstrings
        name: check-docstrings
        entry: uv run python scripts/check_docstrings.py src tests
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --check
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: ruff-lint
        name: ruff-lint
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy
        entry: uv run env MYPYPATH=src mypy --strict --no-site-packages src
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        # Fast, crash-safe per-commit gate: real_model tests are skipped and MLX
        # runs on CPU (see tests/conftest.py). The coverage floor is enforced by
        # the `pytest-coverage` pre-push hook below.
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: pytest-coverage
        name: pytest-coverage (pre-push)
        # Full gate on push: real-model tests included, MLX forced to CPU so it
        # cannot SIGABRT on Metal. Enforces the 75% floor automatically without
        # slowing per-commit runs. `default_install_hook_types` (top of file)
        # wires the pre-push stage on `pre-commit install`.
        entry: env AUTO_CHASM_TEST_DEVICE=cpu uv run pytest --run-real-model --cov=auto_chasm --cov-fail-under=75
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-push]
